name: Skills Daily

on:
  schedule:
    # 北京时间 08:07。刻意避开整点：GitHub 官方文档说明 schedule 在每小时开头
    # 负荷最高，会延迟，甚至直接丢弃排队任务。整点是最差的取值。
    - cron: '7 0 * * *'
    # 备用时段：北京 08:37。第一个被丢弃时这个兜底。
    # guard.mjs 会判断今天是否已生成，已生成则直接退出，不会重复推送。
    - cron: '37 0 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: '报告日期 YYYY-MM-DD（留空＝昨天）'
        required: false
        default: ''
      force:
        description: '强制重跑（忽略今日已发布的判断）'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: skills-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 幂等检查（今天是否已发布）
        id: guard
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          FORCE: ${{ inputs.force }}
        run: node scripts/guard.mjs

      - name: 采集 GitHub 技能仓库快照
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: node scripts/collect.mjs

      - name: 生成日报页面
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: node scripts/build.mjs

      - name: 提交快照与页面
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "skills-daily-bot"
          git config user.email "skills-daily-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore: 日报数据 $(date -u +%Y-%m-%d)"

          # 运行期间若有人往 main 推过东西，直接 push 会被拒绝（fetch first），
          # 一旦失败，后面的部署和推送全被跳过，整期日报就丢了。
          # 所以先 rebase 再推，失败重试；数据文件由本工作流独占，冲突概率极低。
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || {
              echo "rebase 失败，放弃本次变基"
              git rebase --abort 2>/dev/null || true
            }
            if git push origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "推送被拒，5 秒后重试（$i/5）"
            sleep 5
          done
          echo "重试 5 次仍无法推送，失败退出"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.skip != 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
        if: ${{ vars.NOTIFY_ENABLED != 'false' }}
        with:
          # 取最新分支，才能读到 build job 刚推上去的当日日报数据
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        if: ${{ vars.NOTIFY_ENABLED != 'false' }}
        with:
          node-version: 22

      - name: 推送企业微信群机器人
        if: ${{ vars.NOTIFY_ENABLED != 'false' }}
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: node scripts/notify.mjs
