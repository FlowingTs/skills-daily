name: Skills Daily

on:
  schedule:
    # UTC 00:00 == 北京时间 08:00（GitHub 定时任务可能有几分钟延迟）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: '报告日期 YYYY-MM-DD（留空＝昨天）'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: skills-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 采集 GitHub 技能仓库快照
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: node scripts/collect.mjs

      - name: 生成日报页面
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: node scripts/build.mjs

      - name: 提交快照与页面
        run: |
          git config user.name  "skills-daily-bot"
          git config user.email "skills-daily-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 日报数据 $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
        if: ${{ vars.NOTIFY_ENABLED != 'false' }}
        with:
          # 取最新分支，才能读到 build job 刚推上去的当日日报数据
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        if: ${{ vars.NOTIFY_ENABLED != 'false' }}
        with:
          node-version: 22

      - name: 推送企业微信群机器人
        if: ${{ vars.NOTIFY_ENABLED != 'false' }}
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: node scripts/notify.mjs
